<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Familyshot Product Extractor</title>
  <style>
    body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:820px;margin:60px auto;padding:0 20px;color:#111827}
    input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;box-sizing:border-box}button{margin-top:12px;padding:12px 16px;border:0;border-radius:8px;background:#111827;color:#fff;font-size:15px;cursor:pointer}code{background:#f3f4f6;padding:2px 5px;border-radius:5px}.muted{color:#6b7280}
  </style>
</head>
<body>
  <h1>Familyshot Product Extractor</h1>
  <p class="muted">MVP für minilu.de → Varianten, SKU und Originalbilder.</p>
  <form id="form">
    <input id="url" type="url" required value="https://www.minilu.de/shop/product/mundspuelbecher-pp-180ml/111207" />
    <button type="submit">Varianten extrahieren</button>
  </form>
  <p>JSON: <code>/api/extract?url=...</code><br>Amber/HTML: <code>/extract?url=...</code></p>
  <script>
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      location.href = '/extract?url=' + encodeURIComponent(url);
    });
  </script>
</body>
</html>
